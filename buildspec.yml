version: 0.2

phases:
  install:
    commands:
      - echo Installing dependencies...
      - npm ci

  build:
    commands:
      - echo Building React application...
      - npm run build

  post_build:
    commands:
      - echo Preparing deployment package...
      - mkdir -p deploy
      - cp -r dist deploy/
      - cp server.js deploy/
      - cp package.json deploy/
      - cp package-lock.json deploy/

artifacts:
  base-directory: deploy
  files:
    - '**/*'